<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>TINO TV MASTER PRO v9.9 - Master Clean</title>

    <style>
        :root { --neon: #00ffcc; --bg: #000; --card: #121216; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        html, body { background: #000; color: #fff; width: 100vw; height: 100vh; overflow: hidden; }

        .layout-container { display: grid; grid-template-columns: 20% 80%; width: 100%; height: 100%; }

        /* BANNER IZQUIERDO */
        .side-banner { background: #000; border-right: 1px solid #1a1a1a; overflow: hidden; height: 100vh; cursor: pointer; position: sticky; top: 0; }
        .image-scroll { display: flex; flex-direction: column; animation: scroll-up 60s linear infinite; }
        .ad-box { position: relative; width: 100%; border-bottom: 2px solid var(--neon); }
        .ad-box img { width: 100%; height: auto; display: block; }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        /* APP SHELL */
        .app-shell { display: flex; flex-direction: column; height: 100vh; background: #000; overflow-y: auto; }

        header {
            padding: 15px 20px; background: #000; border-bottom: 1px solid #1a1a1a;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2000;
        }
        .logo { font-size: 18px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        .nav-controls { display: flex; gap: 10px; }
        .tv-select {
            background: #111; color: #fff; border: 1px solid #333;
            padding: 8px 12px; border-radius: 6px; font-size: 10px; font-weight: bold;
            outline: none; cursor: pointer;
        }

        /* REPRODUCTOR ESTABLE SIN DISTORSIÓN */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--neon);
            flex-shrink: 0; /* Evita que el video se encoja o estire */
        }

        /* MASCARAS */
        .mask-top { position: absolute; top: 0; left: 0; width: 100%; height: 45px; background: #000; z-index: 150; display: flex; align-items: center; border-bottom: 1px solid var(--neon); overflow: hidden; }
        .ticker { white-space: nowrap; font-size: 14px; font-weight: 900; color: var(--neon); display: inline-block; animation: ticker-move 40s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .mask-right-video { position: absolute; top: 45px; right: 0; width: 33%; height: calc(100% - 90px); background: #000; z-index: 100; border-left: 2px solid #222; }
        .mask-right-video video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 1s; position: absolute; }
        .mask-right-video video.active { opacity: 1; }

        .mask-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: #000; z-index: 100; border-top: 1px solid var(--neon); overflow: hidden; }
        .bottom-scroll { display: flex; animation: scroll-x 25s linear infinite; height: 100%; }
        .bottom-scroll img { height: 100%; padding: 5px; }
        @keyframes scroll-x { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        iframe { width: 100%; height: 100%; border: none; background: #000; }
        .tv-trigger { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .btn-play { background: var(--neon); color: #000; border: none; padding: 20px 50px; border-radius: 12px; font-weight: 900; font-size: 22px; cursor: pointer; }

        /* FOOTER LIGERO */
        footer {
            padding: 20px;
            text-align: center;
            background: #000;
            color: #333;
            font-size: 10px;
            font-weight: bold;
            border-top: 1px solid #111;
            margin-top: auto;
        }
        footer span { color: var(--neon); }

        @media (max-width: 900px) { .side-banner, .mask-right-video { display: none; } .layout-container { grid-template-columns: 100%; } }
    </style>
</head>
<body>

<div class="layout-container">
    <div class="side-banner">
        <div class="image-scroll" id="left-ads"></div>
    </div>

    <div class="app-shell" id="app-viewport">
        <header>
            <div class="logo">TINO TV MASTER</div>
            <div class="nav-controls">
                <select class="tv-select" id="sel-deportes" onchange="quickPlay(this.value)"><option value="">⚽ DEPORTES</option></select>
                <select class="tv-select" id="sel-tv" onchange="quickPlay(this.value)"><option value="">📺 TV ABIERTA</option></select>
                <select class="tv-select" id="sel-cine" onchange="quickPlay(this.value)"><option value="">🎬 CINE</option></select>
            </div>
        </header>

        <div class="player-wrapper">
            <div class="mask-top"><div class="ticker" id="live-ticker">CONECTANDO NOTICIAS EN VIVO...</div></div>
            <div class="mask-right-video">
                <video id="v1" autoplay muted loop playsinline class="active"><source src="images/banner_video.mp4"></video>
                <video id="v2" muted loop playsinline><source src="images/banner_video2.mp4"></video>
            </div>
            <div class="mask-bottom"><div class="bottom-scroll" id="bottom-ads"></div></div>
            <div id="tv-shield" class="tv-trigger">
                <button class="btn-play" id="btn-focus" onclick="startChannel()">▶ CONECTAR SEÑAL</button>
            </div>
            <iframe id="tv-frame" src="" allowfullscreen allow="autoplay"></iframe>
        </div>

        <footer>
            &copy; 2026 - <span>Agustín Pizarro</span>. Todos los derechos reservados.
        </footer>
    </div>
</div>

<script src="tino_tv_data.js"></script>
<script>
    let currentUrl = "";

    function fillAds() {
        const imagesDB = [{ src: "images/banner1.png" }, { src: "images/banner2.png" }, { src: "images/banner3.png" }];
        const cont = document.getElementById('left-ads'), btm = document.getElementById('bottom-ads');
        let html = "", bhtml = "";
        imagesDB.forEach(ad => {
            html += `<div class="ad-box"><img src="${ad.src}" onerror="this.src='${ad.src.replace('images/','imágenes/')}'"></div>`;
            bhtml += `<img src="${ad.src}" onerror="this.src='${ad.src.replace('images/','imágenes/')}'">`;
        });
        cont.innerHTML = html + html;
        btm.innerHTML = bhtml + bhtml + bhtml;
    }

    function switchVideo() {
        const v1 = document.getElementById('v1'), v2 = document.getElementById('v2');
        if(v1.classList.contains('active')) { v1.classList.remove('active'); v2.classList.add('active'); v2.play(); }
        else { v2.classList.remove('active'); v1.classList.add('active'); v1.play(); }
    }

    async function updateNews() {
        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent("https://www.marca.com/rss/futbol.xml")}`);
            const data = await res.json();
            if (data.status === 'ok') {
                document.getElementById('live-ticker').innerText = data.items.map(item => `⚽ ${item.title.toUpperCase()}`).join(" --- ");
            }
        } catch (e) { document.getElementById('live-ticker').innerText = "⚽ BIENVENIDO A TINO TV MASTER --- "; }
    }

    function populateSelects(db) {
        const sDep = document.getElementById('sel-deportes'), sTv = document.getElementById('sel-tv'), sCine = document.getElementById('sel-cine');
        db.forEach(canal => {
            const opt = document.createElement('option');
            opt.value = `${canal.source}|${canal.id}`;
            opt.innerText = canal.name;
            if(canal.cat === "DEPORTES") sDep.appendChild(opt);
            else if(canal.cat === "TV ABIERTA") sTv.appendChild(opt);
            else if(canal.cat === "CINE") sCine.appendChild(opt);
        });
    }

    function quickPlay(val) {
        if(!val) return;
        const [source, id] = val.split('|');
        currentUrl = (source === "cablevision") ? `https://www.cablevisionhd.com/${id}-en-vivo.php` : `https://streamx550.com/global1.php?channel=${id}`;
        document.getElementById('tv-frame').src = "";
        document.getElementById('tv-shield').style.display = 'flex';
        document.getElementById('btn-focus').focus();
    }

    function startChannel() {
        if(currentUrl) { document.getElementById('tv-frame').src = currentUrl; document.getElementById('tv-shield').style.display = 'none'; }
    }

    window.onload = () => {
        fillAds();
        populateSelects(KSD_CHANNELS);
        updateNews();
        setInterval(updateNews, 900000);
        setInterval(switchVideo, 12000);
    };
</script>
</body>
</html>
