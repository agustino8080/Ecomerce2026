<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Forzamos al navegador de la TV a renderizar como Web -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>TINO TV MASTER PRO - Smart TV v5.7</title>

    <style>
        :root { --neon: #00ffcc; --bg: #050505; --card: #121216; --gray: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        /* MODO CINE / PANTALLA COMPLETA TV */
        body.cinema-mode .side-banner,
        body.cinema-mode .video-banner-dual { display: none !important; }

        .layout-container { display: flex; width: 100vw; min-height: 100vh; justify-content: center; }

        /* BANNERS ADAPTADOS */
        .side-banner, .video-banner-dual { width: 220px; background: #000; position: sticky; top: 0; height: 100vh; cursor: pointer; overflow: hidden; }
        .image-scroll { display: flex; flex-direction: column; animation: scroll-up 60s linear infinite; }
        .image-scroll img { width: 100%; border-bottom: 2px solid var(--neon); }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        .video-banner-dual video { width: 100%; height: 50%; object-fit: cover; border-bottom: 1px solid var(--neon); }

        /* CONTENEDOR CENTRAL */
        .app-shell { flex: 1; max-width: 1000px; display: flex; flex-direction: column; background: var(--bg); }
        header { padding: 15px 20px; background: #000; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 16px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        /* REPRODUCTOR MASTER TV */
        .player-wrapper { width: 100%; background: #000; aspect-ratio: 16/9; position: relative; border-bottom: 2px solid var(--neon); }

        .security-shield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .shield-btn {
            background: var(--neon); color: #000; border: none;
            padding: 20px 50px; border-radius: 12px; font-weight: 900;
            cursor: pointer; font-size: 20px; box-shadow: 0 0 30px rgba(0,255,204,0.3);
        }

        iframe { width: 100%; height: 100%; border: none; background: #000; }

        .container { padding: 20px; }
        .cat-name { font-size: 12px; font-weight: 900; color: var(--gray); margin: 20px 0 10px 0; text-transform: uppercase; border-left: 3px solid var(--neon); padding-left: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .channel-card {
            background: var(--card); border-radius: 12px; padding: 15px; text-align: center;
            border: 2px solid #1a1a1a; cursor: pointer; transition: 0.3s; color: #fff;
        }
        .channel-card:focus, .channel-card:hover { border-color: var(--neon); background: #1a1a20; outline: none; transform: scale(1.05); }

        @media (max-width: 1000px) { .side-banner, .video-banner-dual { display: none; } }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- BANNER IZQUIERDO: LÓGICA DE RUTA DINÁMICA -->
    <div class="side-banner" onclick="window.open('https://sportivo.whacka.app/', '_blank')">
        <div class="image-scroll">
            <!-- Buscamos en images/ o en el root -->
            <img src="images/banner1.png" onerror="this.src='banner1.png'">
            <img src="images/banner2.png" onerror="this.src='banner2.png'">
            <img src="images/banner3.png" onerror="this.src='banner3.png'">
            <img src="images/001_In_a_dynamic_athletic_style_a_young_man_with_yKmglmUP.jpg" onerror="this.src='001_In_a_dynamic_athletic_style_a_young_man_with_yKmglmUP.jpg'">
            <img src="images/banner1.png" onerror="this.src='banner1.png'">
        </div>
    </div>

    <div class="app-shell" id="main-scroll">
        <header>
            <div class="logo">TINO TV MASTER</div>
            <button style="background:transparent; border:1px solid #333; color:#555; padding:5px 10px; border-radius:5px; font-size:9px;" onclick="document.body.classList.toggle('cinema-mode')">MODO CINE</button>
        </header>

        <div class="player-wrapper">
            <div id="security-shield" class="security-shield" style="display:none">
                <button class="shield-btn" id="tv-play-trigger" onclick="unlockSignal()">▶ INICIAR CANAL</button>
            </div>

            <!-- REPRODUCTOR SIN BLOQUEO MP4 -->
            <iframe id="tv-frame" src="about:blank"
                    allowfullscreen
                    allow="autoplay; encrypted-media"
                    sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>

        <div class="container" id="main-grid"></div>
    </div>

    <!-- BANNER DERECHO -->
    <div class="video-banner-dual" onclick="window.open('https://sportivo.whacka.app/', '_blank')">
        <video autoplay muted loop playsinline><source src="images/banner_video.mp4" onerror="this.src='banner_video.mp4'"></video>
        <video autoplay muted loop playsinline><source src="images/banner_video2.mp4" onerror="this.src='banner_video2.mp4'"></video>
    </div>
</div>

<script src="tino_tv_data.js"></script>
<script>
    let pendingUrl = "";

    function init() { render(KSD_CHANNELS); }

    function render(db) {
        const container = document.getElementById('main-grid');
        container.innerHTML = "";
        const cats = [...new Set(db.map(c => c.cat))];
        cats.forEach(cat => {
            const h3 = document.createElement('h3'); h3.className = 'cat-name'; h3.innerText = cat;
            const grid = document.createElement('div'); grid.className = 'channels-grid';
            db.filter(c => c.cat === cat).forEach(canal => {
                const card = document.createElement('button');
                card.className = 'channel-card';
                card.onclick = () => preparePlay(canal);
                card.innerHTML = `<div style="font-size:24px">🎬</div><div style="font-size:10px;font-weight:700;margin-top:5px;">${canal.name}</div>`;
                grid.appendChild(card);
            });
            container.appendChild(h3); container.appendChild(grid);
        });
    }

    function preparePlay(canal) {
        pendingUrl = canal.source === "cablevision" ? `https://www.cablevisionhd.com/${canal.id}-en-vivo.php` : `https://streamx550.com/global1.php?channel=${canal.id}`;
        document.getElementById('tv-frame').src = 'about:blank';
        document.getElementById('security-shield').style.display = 'flex';
        // Foco para control remoto
        document.getElementById('tv-play-trigger').focus();
    }

    function unlockSignal() {
        if(!pendingUrl) return;
        document.getElementById('tv-frame').src = pendingUrl;
        document.getElementById('security-shield').style.display = 'none';
        document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = init;
</script>
</body>
</html>
