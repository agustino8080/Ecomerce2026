<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>TINO TV MASTER PRO v12.0 - Absolute Stability</title>

    <style>
        :root { --neon: #00ffcc; --bg: #000; --card: #121216; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body { background: #000; color: #fff; width: 100%; height: 100%; overflow: hidden; }

        .layout-container { display: grid; grid-template-columns: 200px 1fr; width: 100%; height: 100%; }

        /* BANNERS */
        .side-banner { background: #000; border-right: 1px solid #1a1a1a; overflow: hidden; height: 100vh; }
        .image-scroll { display: flex; flex-direction: column; animation: scroll-up 60s linear infinite; }
        .ad-box { width: 100%; border-bottom: 2px solid var(--neon); }
        .ad-box img { width: 100%; height: auto; display: block; }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        /* APP CORE */
        .app-shell { display: flex; flex-direction: column; height: 100vh; background: #000; overflow-y: auto; }
        header {
            padding: 10px 20px; background: #000; border-bottom: 1px solid #1a1a1a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 16px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        /* SELECTORES CON BOTÓN (Garantiza funcionamiento en TV) */
        .nav-controls { display: flex; gap: 5px; align-items: center; }
        .tv-select { background: #111; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 10px; outline: none; max-width: 110px; }
        .btn-go { background: var(--neon); color: #000; border: none; padding: 8px 12px; border-radius: 4px; font-weight: 900; cursor: pointer; }

        /* REPRODUCTOR ESTILO v5.7 */
        .player-wrapper {
            width: 100%; aspect-ratio: 16/9; position: relative;
            background: #080808; overflow: hidden; border-bottom: 2px solid var(--neon);
            flex-shrink: 0;
        }
        .mask-top { position: absolute; top: 0; left: 0; width: 100%; height: 40px; background: #000; z-index: 100; display: flex; align-items: center; border-bottom: 1px solid var(--neon); overflow: hidden; }
        .ticker { white-space: nowrap; font-size: 13px; font-weight: 900; color: var(--neon); display: inline-block; animation: ticker-move 40s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        .player-inner {
            position: absolute;
            top: -8%; left: -8%;
            width: 125%; height: 125%;
            z-index: 1;
            transition: none; /* Eliminamos transiciones para evitar bugs en TV */
        }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* BOTONES RÁPIDOS INFERIORES */
        .quick-grid { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .q-card { background: var(--card); border: 1px solid #222; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 9px; color: #fff; }
        .q-card:focus { border-color: var(--neon); background: #1a1a20; outline: none; transform: scale(1.05); }

        footer { padding: 15px; text-align: center; color: #333; font-size: 10px; font-weight: bold; }

        @media (max-width: 900px) { .side-banner { display: none; } .layout-container { grid-template-columns: 100%; } }
    </style>
</head>
<body>

<div class="layout-container">
    <div class="side-banner"><div class="image-scroll" id="left-ads"></div></div>

    <div class="app-shell" id="tv-content">
        <header>
            <div class="logo">TINO TV</div>
            <div class="nav-controls">
                <select class="tv-select" id="sel-1"><option value="">⚽ DEPORTES</option></select>
                <button class="btn-go" onclick="loadFromSelect('sel-1')">▶</button>
                <select class="tv-select" id="sel-2"><option value="">📺 TV</option></select>
                <button class="btn-go" onclick="loadFromSelect('sel-2')">▶</button>
            </div>
        </header>

        <div class="player-wrapper">
            <div class="mask-top"><div class="ticker" id="live-ticker">BIENVENIDO A TINO TV MASTER - ELIGE UN CANAL Y PRESIONA PLAY...</div></div>
            <div class="player-inner">
                <iframe id="tv-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>

        <div class="quick-grid" id="main-grid">
            <!-- Iconos de respaldo que siempre funcionan -->
        </div>

        <footer>© 2026 - AGUSTÍN PIZARRO.</footer>
    </div>
</div>

<script src="tino_tv_data.js"></script>
<script>
    function fillAssets() {
        const left = document.getElementById('left-ads');
        let html = "";
        for (let i = 1; i <= 17; i++) {
            html += `<div class="ad-box"><img src="images/banner${i}.png" onerror="this.src='im%C3%A1genes/banner${i}.png'"></div>`;
        }
        left.innerHTML = html + html;
    }

    function populate(db) {
        const s1 = document.getElementById('sel-1'), s2 = document.getElementById('sel-2'), grid = document.getElementById('main-grid');
        db.forEach(c => {
            const opt = `<option value="${c.source}|${c.id}">${c.name}</option>`;
            if(c.cat === "DEPORTES") s1.innerHTML += opt;
            else s2.innerHTML += opt;

            const card = document.createElement('button');
            card.className = 'q-card';
            card.innerText = c.name;
            card.onclick = () => play(c.source, c.id);
            grid.appendChild(card);
        });
    }

    function loadFromSelect(id) {
        const val = document.getElementById(id).value;
        if(val) { const parts = val.split('|'); play(parts[0], parts[1]); }
    }

    function play(source, id) {
        const frame = document.getElementById('tv-frame');
        let url = "";
        if(source === "cablevision") url = `https://www.cablevisionhd.com/${id}-en-vivo.php`;
        else if(source === "ksd") url = `https://embed.ksdjugfsddeports.com/embed/${id}.html`;
        else url = `https://streamx550.com/global1.php?channel=${id}`;

        frame.src = url;
        document.getElementById('tv-content').scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function updateNews() {
        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent("https://www.marca.com/rss/futbol.xml")}`);
            const data = await res.json();
            if (data.status === 'ok') document.getElementById('live-ticker').innerText = data.items.map(item => `⚽ ${item.title.toUpperCase()}`).join(" --- ");
        } catch (e) { }
    }

    window.onload = () => { fillAssets(); populate(KSD_CHANNELS); updateNews(); setInterval(updateNews, 900000); };
</script>
</body>
</html>
