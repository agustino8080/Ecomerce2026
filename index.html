<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>TINO TV MASTER PRO - TV Masking Edition v6.0</title>

    <style>
        :root { --neon: #00ffcc; --bg: #000; --card: #121216; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        .layout-container { display: flex; width: 100vw; min-height: 100vh; }

        /* BANNERS LATERALES (Solo visibles en PC) */
        .side-banner { width: 200px; background: #000; overflow: hidden; border-right: 1px solid #1a1a1a; cursor: pointer; }
        .image-scroll { display: flex; flex-direction: column; animation: scroll-up 40s linear infinite; }
        .image-scroll img { width: 100%; border-bottom: 2px solid var(--neon); }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        /* CONTENEDOR PRINCIPAL */
        .app-shell { flex: 1; display: flex; flex-direction: column; background: #000; }

        /* --- SISTEMA DE MASCARAS PARA ANDROID TV --- */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            background: #000;
            overflow: hidden;
            border-bottom: 2px solid var(--neon);
        }

        /* 1. MÁSCARA SUPERIOR (Tapa Logo Original y Titulo) */
        .mask-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            background: #000; z-index: 100; display: flex; align-items: center;
            border-bottom: 1px solid var(--neon); overflow: hidden;
        }
        .ticker { white-space: nowrap; font-size: 14px; font-weight: 900; color: var(--neon); animation: ticker-move 30s linear infinite; }
        @keyframes ticker-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* 2. MÁSCARA DERECHA (Tapa el Chat) */
        .mask-right {
            position: absolute; top: 50px; right: 0; width: 28%; height: calc(100% - 100px);
            background: #000; z-index: 100; border-left: 1px solid #222;
        }
        .mask-right video { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; position: absolute; }
        .mask-right video.active { opacity: 1; }

        /* 3. MÁSCARA INFERIOR (Tapa Redes Sociales) */
        .mask-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: #000; z-index: 100; border-top: 1px solid var(--neon);
            display: flex; overflow: hidden;
        }
        .mask-bottom-scroll { display: flex; animation: scroll-x 20s linear infinite; height: 100%; }
        .mask-bottom-scroll img { height: 100%; width: auto; padding: 5px; }
        @keyframes scroll-x { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* IFRAME AL FONDO */
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 1; }

        /* BOTÓN REPRODUCIR TV */
        .tv-trigger { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 500; display: flex; justify-content: center; align-items: center; }
        .btn-play { background: var(--neon); color: #000; border: none; padding: 20px 40px; border-radius: 10px; font-weight: 900; font-size: 20px; cursor: pointer; }

        .container { padding: 20px; }
        .cat-name { font-size: 11px; font-weight: 900; color: var(--gray); margin: 20px 0 10px 0; text-transform: uppercase; border-left: 3px solid var(--neon); padding-left: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .channel-card { background: var(--card); border: 2px solid #1a1a1a; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; color: #fff; }
        .channel-card:focus { border-color: var(--neon); background: #1a1a20; outline: none; transform: scale(1.05); }

        @media (max-width: 1000px) { .side-banner { display: none; } }
    </style>
</head>
<body>

<div class="layout-container">
    <div class="side-banner" onclick="window.open('https://sportivo.whacka.app/', '_blank')">
        <div class="image-scroll">
            <img src="images/banner1.png"><img src="images/banner2.png"><img src="images/banner3.png">
            <img src="images/banner1.png"><img src="images/banner2.png">
        </div>
    </div>

    <div class="app-shell" id="tv-scroll">
        <header>
            <div class="logo">TINO TV MASTER</div>
            <div style="color: var(--neon); font-size: 10px; font-weight: 900;">TV MODE ACTIVE</div>
        </header>

        <div class="player-wrapper">
            <!-- MASCARAS DE COBERTURA -->
            <div class="mask-top">
                <div class="ticker">
                    ⚽ ÚLTIMA HORA: EL MERCADO DE FICHAJES SE MUEVE EN EUROPA -- 🏀 NBA: THUNDER DOMINA LA CONFERENCIA OESTE -- 🏁 F1: GRAN PREMIO DE CANADÁ ESTE FIN DE SEMANA -- 📺 DISFRUTA DE LA MEJOR PROGRAMACIÓN EN TINO TV MASTER --
                </div>
            </div>

            <div class="mask-right">
                <video id="tv-vid1" autoplay muted loop playsinline class="active"><source src="images/banner_video.mp4"></video>
                <video id="tv-vid2" muted loop playsinline><source src="images/banner_video2.mp4"></video>
            </div>

            <div class="mask-bottom">
                <div class="mask-bottom-scroll">
                    <img src="images/banner1.png"><img src="images/banner2.png"><img src="images/banner3.png">
                    <img src="images/banner1.png"><img src="images/banner2.png"><img src="images/banner3.png">
                </div>
            </div>

            <div id="tv-shield" class="tv-trigger">
                <button class="btn-play" id="btn-focus" onclick="startChannel()">▶ REPRODUCIR CANAL</button>
            </div>

            <iframe id="tv-frame" src="about:blank" allowfullscreen allow="autoplay" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>

        <div class="container" id="main-grid"></div>
    </div>
</div>

<script src="tino_tv_data.js"></script>
<script>
    let currentUrl = "";

    function init() {
        render(KSD_CHANNELS);
        setInterval(switchRightVideo, 10000);
    }

    function switchRightVideo() {
        const v1 = document.getElementById('tv-vid1');
        const v2 = document.getElementById('tv-vid2');
        if(v1.classList.contains('active')) {
            v1.classList.remove('active'); v2.classList.add('active'); v2.play();
        } else {
            v2.classList.remove('active'); v1.classList.add('active'); v1.play();
        }
    }

    function render(db) {
        const container = document.getElementById('main-grid');
        container.innerHTML = "";
        const cats = [...new Set(db.map(c => c.cat))];
        cats.forEach(cat => {
            const h3 = document.createElement('h3'); h3.className = 'cat-name'; h3.innerText = cat;
            const grid = document.createElement('div'); grid.className = 'channels-grid';
            db.filter(c => c.cat === cat).forEach(canal => {
                const card = document.createElement('button');
                card.className = 'channel-card';
                card.onclick = () => {
                    currentUrl = canal.source === "cablevision" ? `https://www.cablevisionhd.com/${canal.id}-en-vivo.php` : `https://streamx550.com/global1.php?channel=${canal.id}`;
                    document.getElementById('tv-frame').src = 'about:blank';
                    document.getElementById('tv-shield').style.display = 'flex';
                    document.getElementById('btn-focus').focus();
                    document.getElementById('tv-scroll').scrollTo({ top: 0, behavior: 'smooth' });
                };
                card.innerHTML = `<div style="font-size:24px">🎬</div><div style="font-size:9px;font-weight:700;margin-top:5px;">${canal.name}</div>`;
                grid.appendChild(card);
            });
            container.appendChild(h3); container.appendChild(grid);
        });
    }

    function startChannel() {
        if(!currentUrl) return;
        document.getElementById('tv-frame').src = currentUrl;
        document.getElementById('tv-shield').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
