<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <title>TINO TV MASTER - Security Verified</title>
    <style>
        :root { --neon: #00ffcc; --bg: #050505; --card: #121216; --gray: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        .layout-container { display: flex; width: 100vw; min-height: 100vh; justify-content: center; }

        /* BANNERS */
        .side-banner { width: 240px; background: #000; overflow: hidden; position: sticky; top: 0; height: 100vh; border-right: 1px solid #1a1a1a; cursor: pointer; }
        .image-scroll { display: flex; flex-direction: column; animation: scroll-up 50s linear infinite; }
        .image-scroll img { width: 100%; height: auto; border-bottom: 2px solid var(--neon); }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        .video-banner-dual { width: 240px; background: #000; position: sticky; top: 0; height: 100vh; border-left: 1px solid #1a1a1a; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
        .video-banner-dual video { width: 100%; height: 50%; object-fit: cover; border-bottom: 1px solid var(--neon); }

        /* APP CORE */
        .app-shell { flex: 1; max-width: 950px; display: flex; flex-direction: column; background: var(--bg); overflow-y: auto; border-left: 1px solid #111; border-right: 1px solid #111; }
        header { padding: 15px 20px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 16px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        /* REPRODUCTOR PROTEGIDO */
        .player-wrapper { width: 100%; background: #000; aspect-ratio: 16/9; position: relative; border-bottom: 2px solid var(--neon); }

        /* ESCUDO DE SEGURIDAD */
        .security-shield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        .shield-btn {
            background: var(--neon); color: #000; border: none;
            padding: 15px 30px; border-radius: 50px; font-weight: 900;
            cursor: pointer; box-shadow: 0 0 20px var(--neon); margin-top: 15px;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .container { padding: 20px; flex: 1; }
        .cat-name { font-size: 11px; font-weight: 900; color: var(--gray); letter-spacing: 2px; margin: 25px 0 10px 0; text-transform: uppercase; border-left: 3px solid var(--neon); padding-left: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .channel-card { background: var(--card); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #1a1a1a; cursor: pointer; transition: 0.2s; }
        .channel-card:hover { border-color: var(--neon); background: #1a1a20; }
        .name { font-size: 9px; font-weight: 700; color: #eee; }

        @media (max-width: 900px) { .side-banner, .video-banner-dual { display: none; } }
    </style>
</head>
<body>

<div class="layout-container">
    <div class="side-banner" onclick="window.open('https://sportivo.whacka.app/', '_blank')">
        <div class="image-scroll">
            <img src="images/banner1.png"><img src="images/banner2.png"><img src="images/banner3.png">
            <img src="images/banner1.png"><img src="images/banner2.png"><img src="images/banner3.png">
        </div>
    </div>

    <div class="app-shell" id="app-scroll">
        <header>
            <div class="logo">TINO TV MASTER</div>
            <div style="font-size: 8px; color: #00ffcc; font-weight: 900; border: 1px solid #00ffcc; padding: 2px 5px; border-radius: 4px;">PROTECCIÓN ACTIVA 🛡️</div>
        </header>

        <div class="player-wrapper">
            <!-- ESCUDO DE PERMISOS -->
            <div id="security-shield" class="security-shield">
                <div style="font-size: 30px;">🛡️</div>
                <h3 style="font-size: 14px; margin-top: 10px;">VERIFICACIÓN DE SEGUIDAD</h3>
                <p style="font-size: 10px; color: #666; margin-top: 5px; max-width: 250px;">
                    Este canal proviene de un servidor externo. Se han bloqueado <b>descargas automáticas</b> y <b>pop-ups</b> para tu seguridad.
                </p>
                <button class="shield-btn" onclick="unlockSignal()">CONECTAR SEÑAL SEGURA</button>
            </div>

            <!-- REPRODUCTOR BLINDADO -->
            <iframe id="tv-frame" src="about:blank"
                    allowfullscreen
                    allow="autoplay; encrypted-media"
                    sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>

        <div class="container" id="main-grid"></div>
    </div>

    <div class="video-banner-dual" onclick="window.open('https://sportivo.whacka.app/', '_blank')">
        <video autoplay muted loop playsinline><source src="images/banner_video.mp4" type="video/mp4"></video>
        <video autoplay muted loop playsinline><source src="images/banner_video2.mp4" type="video/mp4"></video>
    </div>
</div>

<script src="tino_tv_data.js"></script>
<script>
    let pendingUrl = "";

    function init() { render(KSD_CHANNELS); }

    function render(db) {
        const container = document.getElementById('main-grid');
        container.innerHTML = "";
        const cats = [...new Set(db.map(c => c.cat))];
        cats.forEach(cat => {
            const h3 = document.createElement('h3'); h3.className = 'cat-name'; h3.innerText = cat;
            const grid = document.createElement('div'); grid.className = 'channels-grid';
            db.filter(c => c.cat === cat).forEach(canal => {
                const card = document.createElement('div'); card.className = 'channel-card';
                card.onclick = () => preparePlay(canal);
                card.innerHTML = `<div style="font-size:18px;margin-bottom:5px">🎬</div><div class="name">${canal.name}</div>`;
                grid.appendChild(card);
            });
            container.appendChild(h3); container.appendChild(grid);
        });
    }

    function preparePlay(canal) {
        pendingUrl = canal.source === "cablevision" ? `https://www.cablevisionhd.com/${canal.id}-en-vivo.php` : `https://streamx550.com/global1.php?channel=${canal.id}`;

        // Reiniciamos el escudo cada vez que cambias de canal
        document.getElementById('tv-frame').src = 'about:blank';
        document.getElementById('security-shield').style.display = 'flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function unlockSignal() {
        if(!pendingUrl) return;

        // Pedimos confirmación final
        if(confirm("Confirmar conexión con el servidor de video. Se bloqueará cualquier intento de descarga maliciosa automáticamente.")) {
            document.getElementById('tv-frame').src = pendingUrl;
            document.getElementById('security-shield').style.display = 'none';
        }
    }

    window.onload = init;
</script>
</body>
</html>
